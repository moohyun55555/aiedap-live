<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>연수 사이트 초기화</title>
<style>
:root{--bg:#f6f2ee;--card:#fff;--ink:#2a211c;--muted:#6b5d54;--line:#e6d9ce;--accent:#a84e24;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 10px}
label{display:block;font-weight:600;margin-bottom:6px}
input{font:inherit;width:100%;max-width:280px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff;min-height:44px}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:var(--bad)}
.btn.danger.armed{background:#7a1410}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.msg{min-height:1.4em;margin-top:8px;color:var(--muted)}
.msg.err{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
th{color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.zero{color:var(--ok);font-weight:700}
.some{color:var(--bad);font-weight:700}
.big{font-size:20px;font-weight:800;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>연수 사이트 초기화</h1>
  <p class="sub">연수 전에 채팅, 별(우주), 17개 모둠 게시판, 슬라이드 위치를 깨끗하게 비웁니다. 발표자만 쓸 수 있어요.</p>

  <section class="card" id="loginCard">
    <h2>1. 발표자 로그인</h2>
    <form id="loginForm">
      <label for="pw">발표자 비밀번호 (숫자 8자리)</label>
      <input id="pw" type="password" autocomplete="current-password" inputmode="numeric">
      <div class="row"><button class="btn" type="submit" id="loginBtn">로그인</button></div>
      <div class="msg" id="loginMsg" role="status"></div>
    </form>
  </section>

  <section class="card hide" id="stateCard">
    <h2>2. 지금 남아 있는 기록</h2>
    <div id="summary" class="big"></div>
    <table id="mainTable" aria-label="연수 사이트 기록"></table>
    <p style="margin:14px 0 6px;font-weight:600">모둠 게시판 (선생님 카드 / 피드백 문서)</p>
    <div class="grid" id="boardGrid"></div>
    <div class="row"><button class="btn ghost" type="button" id="refreshBtn">다시 확인</button></div>
  </section>

  <section class="card hide" id="resetCard">
    <h2>3. 모두 초기화</h2>
    <p style="margin:0">채팅, 별, 모든 모둠의 카드와 피드백을 지우고 슬라이드를 1번으로 돌립니다. <b>지운 기록은 되돌릴 수 없어요.</b></p>
    <div class="row"><button class="btn danger" type="button" id="resetBtn">모두 초기화</button></div>
    <div class="msg" id="resetMsg" role="status"></div>
  </section>
</main>

<script src="../firebase-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const V = '10.12.2';
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.append(s); });
const EMAIL = window.PRESENTER_EMAIL || 'presenter@aiedap-live.kr';
const GROUPS = 17;
let M = null, A = null, B = null;   // 메인, 게시판 1~8, 게시판 9~17
const boardOf = g => (g >= 9 ? B : A);

async function init() {
  await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${V}/firebase-app-compat.js`);
  await Promise.all([loadScript(`https://cdn.jsdelivr.net/npm/firebase@${V}/firebase-firestore-compat.js`), loadScript(`https://cdn.jsdelivr.net/npm/firebase@${V}/firebase-auth-compat.js`)]);
  M = firebase.initializeApp(window.FIREBASE_CONFIG);
  A = firebase.initializeApp(window.BOARD_FIREBASE_CONFIG_A, 'boardA');
  B = firebase.initializeApp(window.BOARD_FIREBASE_CONFIG_B, 'boardB');
}
const ready = init().catch(() => { $('loginMsg').className = 'msg err'; $('loginMsg').textContent = '서버 연결 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'; });

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('pw').value.trim(); if (!pw) { $('pw').focus(); return; }
  await ready; if (!M) return;
  $('loginBtn').disabled = true; $('loginMsg').className = 'msg'; $('loginMsg').textContent = '로그인 중…';
  const names = ['연수 사이트', '게시판 1~8모둠', '게시판 9~17모둠'];
  const res = await Promise.allSettled([M, A, B].map(app => app.auth().signInWithEmailAndPassword(EMAIL, pw)));
  $('loginBtn').disabled = false;
  const bad = res.map((r, i) => r.status === 'rejected' ? names[i] : null).filter(Boolean);
  if (bad.length === 3) { $('loginMsg').className = 'msg err'; $('loginMsg').textContent = '비밀번호가 맞지 않습니다.'; return; }
  if (bad.length) { $('loginMsg').className = 'msg err'; $('loginMsg').textContent = `${bad.join(', ')}에 로그인하지 못했습니다. 그 부분은 초기화할 수 없어요.`; }
  else $('loginMsg').textContent = '로그인했습니다.';
  $('pw').value = '';
  $('stateCard').classList.remove('hide'); $('resetCard').classList.remove('hide');
  await check();
});

async function sizeOf(q) { const s = await q.get(); return s.size; }
async function check() {
  $('summary').textContent = '확인하는 중…'; $('refreshBtn').disabled = true; $('resetBtn').disabled = true;
  const db = M.firestore();
  const rows = []; let total = 0;
  try {
    const chat = await sizeOf(db.collection('live').doc('state').collection('chat'));
    const uni = await sizeOf(db.collection('universe'));
    const st = await db.collection('live').doc('state').get(); const s = st.exists ? st.data() : {};
    total += chat + uni;
    rows.push(['채팅 메시지', chat], ['우주의 별', uni]);
    const flags = [];
    if ((s.slide || 1) !== 1) flags.push(`슬라이드 ${s.slide}번`);
    if (s.lock) flags.push('화면 고정 켜짐');
    if (s.chatPaused) flags.push('채팅 멈춤 켜짐');
    if (s.uniOpen) flags.push('우주 공유 열림');
    rows.push(['슬라이드·화면 상태', flags.length ? flags.join(', ') : '처음 상태(1번)']);
    if (flags.length) total += 1;
    $('mainTable').innerHTML = '<tr><th>항목</th><th style="text-align:right">남은 개수</th></tr>' + rows.map(([k, v]) => `<tr><td>${k}</td><td class="n ${v === 0 || v === '처음 상태(1번)' ? 'zero' : 'some'}">${v}</td></tr>`).join('');
  } catch (e) { $('mainTable').innerHTML = `<tr><td class="some">연수 사이트 기록을 확인하지 못했습니다 (${e.code || e.message}).</td></tr>`; total += 1; }
  const cells = await Promise.all(Array.from({ length: GROUPS }, (_, k) => k + 1).map(async g => {
    try {
      const gref = boardOf(g).firestore().collection('groups').doc(String(g));
      const [t, f] = await Promise.all([sizeOf(gref.collection('teachers')), sizeOf(gref.collection('fb'))]);
      total += t + f;
      return `<div>${g}모둠 <span class="${t + f ? 'some' : 'zero'}">${t} / ${f}</span></div>`;
    } catch (e) { total += 1; return `<div>${g}모둠 <span class="some">확인 실패</span></div>`; }
  }));
  $('boardGrid').innerHTML = cells.join('');
  $('summary').innerHTML = total === 0 ? '<span class="zero">✅ 모두 비어 있습니다. 연수를 시작할 준비가 됐어요.</span>' : `<span class="some">남은 기록이 있습니다.</span>`;
  $('refreshBtn').disabled = false; $('resetBtn').disabled = false;
  return total;
}
$('refreshBtn').onclick = () => check();

async function deleteAll(query) {
  let n = 0;
  for (;;) {
    const snap = await query.limit(400).get();
    if (snap.empty) return n;
    const batch = snap.docs[0].ref.firestore.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit(); n += snap.size;
  }
}
$('resetBtn').onclick = async () => {
  const b = $('resetBtn');
  if (!b.classList.contains('armed')) {
    b.classList.add('armed'); b.textContent = '한 번 더 누르면 모두 지웁니다';
    setTimeout(() => { if (!b.disabled) { b.classList.remove('armed'); b.textContent = '모두 초기화'; } }, 5000);
    return;
  }
  b.disabled = true; b.classList.remove('armed'); b.textContent = '지우는 중…';
  const msg = $('resetMsg'); msg.className = 'msg'; const errs = [];
  const db = M.firestore();
  const step = async (label, fn) => { msg.textContent = label + ' 지우는 중…'; try { await fn(); } catch (e) { errs.push(`${label}(${e.code || e.message})`); } };
  await step('채팅', () => deleteAll(db.collection('live').doc('state').collection('chat')));
  await step('별', () => deleteAll(db.collection('universe')));
  await step('슬라이드 상태', () => db.collection('live').doc('state').set({ slide: 1, recall: 0, lock: false, chatPaused: false, uniOpen: false }, { merge: true }));
  await step('채팅 요약본', () => db.collection('live').doc('chatDigest').set({ msgs: [], at: firebase.firestore.FieldValue.serverTimestamp() }));
  for (let g = 1; g <= GROUPS; g++) {
    await step(`${g}모둠`, async () => {
      const gref = boardOf(g).firestore().collection('groups').doc(String(g));
      await deleteAll(gref.collection('fb'));
      await deleteAll(gref.collection('teachers'));
    });
  }
  b.textContent = '모두 초기화';
  const left = await check();
  if (errs.length) { msg.className = 'msg err'; msg.textContent = '지우지 못한 곳: ' + errs.join(', ') + ' — 다시 로그인한 뒤 한 번 더 눌러 주세요.'; }
  else if (left === 0) { msg.className = 'msg'; msg.textContent = '초기화를 마쳤습니다. 모든 기록이 0개입니다.'; }
  else { msg.className = 'msg err'; msg.textContent = '아직 남은 기록이 있습니다. 한 번 더 눌러 주세요.'; }
};
</script>
</body>
</html>
