<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still — 타이머</title>
<style>
:root{color-scheme:dark;font-family:Arial,system-ui,sans-serif;background:#101715;color:#edf1e6}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center}
#app{position:relative;width:min(100vw,177.777778dvh);height:min(100dvh,56.25vw);container-type:size;background:radial-gradient(ellipse at 50% 42%,#1c2921,#101715 75%)}
header{position:absolute;inset:4% 4% auto;display:flex;justify-content:space-between;align-items:center;z-index:2}
.brand{font-size:clamp(16px,2cqw,28px);font-weight:700;color:#a3b09b}
button,input{font:inherit}
button{cursor:pointer;border:1px solid #ffffff18;border-radius:9px;background:#ffffff03;color:#b8c5ae;padding:8px 15px}
button:hover{background:#ffffff12}
button:focus-visible,input:focus-visible{outline:2px solid #d5eca5;outline-offset:4px}
#full{height:40px;width:40px;padding:0;font-size:24px}
#timer{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:min(27cqw,48cqh);line-height:1;letter-spacing:-.045em;white-space:nowrap;font-variant-numeric:tabular-nums}
#timer.long{font-size:min(23cqw,45cqh)}
#timer.done{color:#d5eca5}
.controls{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;width:max-content;max-width:94%}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.presets button{font-size:12px}
.presets button.selected{color:#d5eca5;border-color:#d5eca566;background:#d5eca50c}
#start{height:45px;min-width:180px;background:#d5eca5;color:#25311e;border:0;font-weight:600}
#start:hover{background:#e3f5c4}
#reset{height:45px;width:45px;padding:0;font-size:25px}
form{font-size:12px}
form input{width:80px;padding:6px;margin:0 8px;border:1px solid #536747;border-radius:6px;background:#18231c}
form button{background:#d5eca5;color:#25311e;padding:7px 12px}
#notice{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
:fullscreen #app{width:100vw;height:100dvh}
#app:has(form:not([hidden])) #timer{top:37%;font-size:min(24cqw,42cqh)}
@media(max-height:650px) and (min-width:601px){
.controls{gap:7px;bottom:9%}
button{padding:5px 12px}
#start,#reset{height:36px}
#timer{top:39%;font-size:min(26cqw,45cqh)}
}
@media(max-width:600px){
#app{width:100vw;height:100dvh}
#timer{font-size:26cqw;top:38%}
#timer.long{font-size:22cqw}
.controls{bottom:19%;gap:16px}
#app:has(form:not([hidden])) #timer{font-size:25cqw;top:33%}
}
</style>
</head>
<body>
<div id="app">
<header>
<span class="brand">still.</span>
<button id="full" aria-label="전체 화면" title="전체 화면">⛶</button>
</header>
<div id="timer" role="timer" aria-label="남은 시간 25분">25:00</div>
<div class="controls">
<div class="row">
<button id="minus" aria-label="1분 줄이기">− 1분</button>
<button id="plus" aria-label="1분 늘리기">+ 1분</button>
</div>
<div class="row presets">
<button data-min="5">5분</button>
<button data-min="15">15분</button>
<button data-min="25" class="selected">25분</button>
<button data-min="45">45분</button>
<button id="custom" aria-expanded="false">직접 설정 ↗</button>
</div>
<form id="form" hidden>
<label for="input">분</label>
<input id="input" type="number" min="1" max="999" value="25" required>
<button type="submit">적용</button>
</form>
<div class="row">
<button id="start">▶ 시작</button>
<button id="reset" aria-label="초기화" title="초기화">↺</button>
</div>
</div>
<div id="notice" role="status" aria-live="polite"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let initial=1500,remaining=1500,running=false,deadline=0,done=false,context;

function render(){
  const seconds=Math.max(0,Math.ceil(remaining));
  const value=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
  $("timer").textContent=value;
  $("timer").setAttribute("aria-label",`남은 시간 ${Math.floor(seconds/60)}분 ${seconds%60}초`);
  $("timer").classList.toggle("long",seconds>=6000);
  $("timer").classList.toggle("done",done);
  $("start").textContent=running?"Ⅱ 일시정지":done?"▶ 다시 시작":remaining!==initial?"▶ 계속":"▶ 시작";
  document.title=running?value+" — Still":"Still — 타이머";
  document.querySelectorAll("[data-min]").forEach(b=>b.classList.toggle("selected",Number(b.dataset.min)*60===initial));
}
function prepareAudio(){
  try{
    context??=new(window.AudioContext||window.webkitAudioContext)();
    if(context.state==="suspended")context.resume().catch(()=>{});
  }catch{}
}
function chime(){
  if(!context)return;
  const now=context.currentTime;
  [523.25,659.25,783.99].forEach((frequency,i)=>{
    const oscillator=context.createOscillator(),gain=context.createGain();
    const start=now+i*.18;
    oscillator.type="sine";
    oscillator.frequency.value=frequency;
    gain.gain.setValueAtTime(0,start);
    gain.gain.linearRampToValueAtTime(.13,start+.035);
    gain.gain.exponentialRampToValueAtTime(.001,start+1.05);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
    oscillator.start(start);
    oscillator.stop(start+1.1);
  });
}
function finish(){
  running=false;remaining=0;done=true;
  chime();
  $("notice").textContent="타이머 완료";
  render();
}
function tick(){
  if(!running)return;
  remaining=Math.max(0,(deadline-Date.now())/1000);
  if(remaining<=0)finish();else render();
}
function toggle(){
  prepareAudio();
  if(running){
    tick();
    if(!running)return;
    running=false;
  }else{
    if(remaining<=0)remaining=initial;
    done=false;
    deadline=Date.now()+remaining*1000;
    running=true;
    $("notice").textContent="";
  }
  render();
}
function setTime(minutes){
  initial=remaining=minutes*60;done=false;
  if(running)deadline=Date.now()+remaining*1000;
  $("notice").textContent="";
  render();
}
function adjust(delta){
  if(running)tick();
  remaining=Math.min(999*60,Math.max(0,remaining+delta));
  if(running){
    deadline=Date.now()+remaining*1000;
    if(!remaining)return finish();
  }else{
    initial=Math.max(60,remaining);
    done=remaining===0;
  }
  $("notice").textContent="";
  render();
}
async function fullscreen(){
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
    else $("notice").textContent="이 브라우저는 전체 화면을 지원하지 않습니다.";
  }catch{$("notice").textContent="전체 화면을 열 수 없습니다."}
}
$("start").onclick=toggle;
$("minus").onclick=()=>adjust(-60);
$("plus").onclick=()=>adjust(60);
$("reset").onclick=()=>{
  running=false;remaining=initial;done=false;
  $("notice").textContent="";render();
};
document.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>setTime(Number(b.dataset.min)));
$("custom").onclick=()=>{
  $("form").hidden=!$("form").hidden;
  $("custom").setAttribute("aria-expanded",String(!$("form").hidden));
  if(!$("form").hidden)$("input").focus();
};
$("form").onsubmit=e=>{
  e.preventDefault();
  const minutes=Number($("input").value);
  if(!Number.isInteger(minutes)||minutes<1||minutes>999)return;
  setTime(minutes);
  $("form").hidden=true;
  $("custom").setAttribute("aria-expanded","false");
};
$("full").onclick=fullscreen;
document.addEventListener("fullscreenchange",()=>{
  const label=document.fullscreenElement?"전체 화면 종료":"전체 화면";
  $("full").setAttribute("aria-label",label);
  $("full").title=label;
});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,button,textarea,select,a,[contenteditable]")||e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  if(e.code==="Space"){e.preventDefault();toggle()}
  if(e.key.toLowerCase()==="f"){e.preventDefault();fullscreen()}
});
document.addEventListener("visibilitychange",tick);
setInterval(tick,200);
render();
</script>
</body>
</html>
